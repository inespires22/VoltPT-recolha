# Estado em tempo real de todas as tomadas (NAP Portugal / MOBI.E) -> Supabase.
# Disparado a cada 10 min pelo cron-job.org (ver README); o agendamento do GitHub é só reserva,
# porque o GitHub atrasa ou salta agendamentos frequentes.
name: estado
on:
  schedule:
    - cron: '7-59/15 * * * *'
  workflow_dispatch:
concurrency: { group: estado, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  estado:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Ler estados e gravar mudanças
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLIC_LOGS: '1'
        run: |
          python -m ingestion.run_ingest --source nap-status | tee resultado.json
          python -c "import json;d=json.load(open('resultado.json'));print('| campo | valor |\n|---|---|');[print(f'| {k} | {v} |') for k,v in d.items()]" >> "$GITHUB_STEP_SUMMARY"
