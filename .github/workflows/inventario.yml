# Inventário oficial de postos e tomadas (NAP Portugal / MOBI.E) -> Supabase, 1x/dia.
name: inventario
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
concurrency: { group: inventario, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: Ler inventário e atualizar postos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLIC_LOGS: '1'
        run: |
          python -m ingestion.run_ingest --source nap-infra --skip-watches | tee resultado.json
          python -c "import json;d=json.load(open('resultado.json'));print('| campo | valor |\n|---|---|');[print(f'| {k} | {v} |') for k,v in d.items()]" >> "$GITHUB_STEP_SUMMARY"
